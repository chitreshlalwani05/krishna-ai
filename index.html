<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #020617;
  color: white;
}

/* TOP */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 10px;
}

/* SIDENAV */
.sidenav {
  position: fixed;
  left: -260px;
  top: 0;
  width: 260px;
  height: 100%;
  background: #111827;
  padding: 10px;
  transition: 0.3s;
}

.sidenav.open {
  left: 0;
}

.chat-item {
  padding: 10px;
  border-bottom: 1px solid #1f2937;
  cursor: pointer;
}

/* CHAT */
.chat {
  padding: 10px;
  height: 70vh;
  overflow-y: auto;
}

/* INPUT */
.input-box {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div onclick="toggleMenu()">☰</div>
  <div id="userInfo">Not logged in</div>
</div>

<div id="sidenav" class="sidenav"></div>

<div id="chat" class="chat"></div>

<div class="input-box">
  <input id="input" placeholder="Type..." />
  <button onclick="send()">Send</button>
</div>

<script>

const BASE = "https://krishna-ai-w8we.onrender.com";

const firebaseConfig = {
  apiKey: "AIzaSyD...",
  authDomain: "krishna-ai-de684.firebaseapp.com",
  projectId: "krishna-ai-de684"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let currentChatId = null;

// AUTH
auth.onAuthStateChanged(user => {
  document.getElementById("userInfo").innerText = user ? user.email : "Not logged in";
  if (user) loadChats();
});

// MENU
function toggleMenu() {
  document.getElementById("sidenav").classList.toggle("open");
}

// LOAD CHAT LIST
async function loadChats() {
  const user = auth.currentUser;

  const res = await fetch(BASE + "/chats", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ userId: user.uid })
  });

  const data = await res.json();

  const nav = document.getElementById("sidenav");
  nav.innerHTML = "<h3>Chats</h3>";

  data.chats.forEach(c => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = c.date;
    div.onclick = () => loadChat(c.chatId);
    nav.appendChild(div);
  });
}

// LOAD CHAT
async function loadChat(chatId) {
  const user = auth.currentUser;

  currentChatId = chatId;

  const res = await fetch(BASE + "/chat-history", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ userId: user.uid, chatId })
  });

  const data = await res.json();

  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  data.history.forEach(m => {
    chat.innerHTML += `<div>${m.content[0].text}</div>`;
  });
}

// CREATE CHAT
async function createChat() {
  const user = auth.currentUser;

  const res = await fetch(BASE + "/new-chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ userId: user.uid })
  });

  const data = await res.json();
  currentChatId = data.chatId;
}

// SEND
async function send() {
  const user = auth.currentUser;
  const text = document.getElementById("input").value;

  if (!currentChatId) await createChat();

  const res = await fetch(BASE + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      userId: user.uid,
      chatId: currentChatId,
      message: text
    })
  });

  const data = await res.json();

  const chat = document.getElementById("chat");

  chat.innerHTML += `<div>${text}</div>`;
  chat.innerHTML += `<div>${data.answer}</div>`;
}

</script>

</body>
</html>
