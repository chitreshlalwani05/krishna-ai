<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krishna Chat</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(#020617, #0f172a);
  color: white;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
}

h2 {
  text-align: center;
}

.chat {
  height: 400px;
  overflow-y: auto;
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.msg {
  margin: 10px 0;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  text-align: right;
  color: #38bdf8;
}

.bot {
  text-align: left;
  color: #e2e8f0;
}

.input-box {
  display: flex;
  gap: 5px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  padding: 10px;
  background: orange;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.loading {
  font-size: 12px;
  color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

  <h2>🕉 Krishna Chat</h2>

  <div id="chat" class="chat"></div>

  <div class="loading" id="loading"></div>

  <div class="input-box">
    <input id="input" placeholder="Apni baat likho..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
let messages = [];

async function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage("user", text);

  messages.push({ role: "user", content: text });

  input.value = "";

  document.getElementById("loading").innerText = "Krishna sun rahe hain...";

  try {
    const res = await fetch("http://localhost:3000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();

    addMessage("bot", data.answer);

    messages.push({ role: "assistant", content: data.answer });

    document.getElementById("loading").innerText = "";

  } catch (err) {
    document.getElementById("loading").innerText = "Error aaya...";
  }
}

function addMessage(role, text) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
