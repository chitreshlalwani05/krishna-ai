<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna AI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color: white;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  font-size: 12px;
  color: #94a3b8;
}

/* HERO */
.hero {
  text-align: center;
  margin-top: 15vh;
}

/* CHAT */
.chat {
  max-width: 500px;
  margin: auto;
  padding: 10px;
  padding-bottom: 100px;
  display: none;
  height: 70vh;
  overflow-y: auto;
}

/* MESSAGE */
.msg {
  max-width: 75%;
  padding: 12px;
  border-radius: 14px;
  margin: 8px 0;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.bot {
  background: rgba(255,255,255,0.08);
}

/* INPUT */
.input-box {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 500px;
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 25px;
  border: none;
  background: #1e293b;
  color: white;
}

button {
  padding: 14px;
  border-radius: 25px;
  border: none;
  background: #f59e0b;
}

/* 🔥 LOGIN WALL FIXED */
.login-wall {
  max-width: 500px;
  margin: 20px auto;
  text-align: center;
  display: none;
}

.login-wall button {
  width: 80%;
  border-radius: 25px;
  font-size: 16px;
}

/* HIDE INPUT WHEN LOCKED */
.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="topbar">
  <div id="userInfo">Not logged in</div>
  <div onclick="logout()" id="logoutBtn" style="display:none;cursor:pointer;">Logout</div>
</div>

<div id="hero" class="hero">
  <h2>Kuch toh chal raha hai tumhare andar…</h2>
</div>

<div id="chat" class="chat"></div>

<!-- 🔥 LOGIN ABOVE INPUT -->
<div id="loginWall" class="login-wall">
  <p>yeh sirf shuruaat hai…</p>
  <button onclick="login()">Login toh karo aap ! →</button>
</div>

<!-- 🔥 INPUT -->
<div class="input-box" id="inputBox">
  <input id="input" placeholder="Jo bhi mann mein hai likho..." />
  <button onclick="send()">→</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDAr4d1GGJ3bVOTEY_VyTAeXGPCRYL8cyA",
  authDomain: "krishna-ai-de684.firebaseapp.com",
  projectId: "krishna-ai-de684"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let hasShownLoginGate = false;
let isLocked = false;

// AUTH
auth.onAuthStateChanged(user => {
  document.getElementById("userInfo").innerText = user ? user.email : "Not logged in";
  document.getElementById("logoutBtn").style.display = user ? "block" : "none";

  if (user) {
    document.getElementById("loginWall").style.display = "none";
    document.getElementById("inputBox").classList.remove("hidden");
    isLocked = false;
  }
});

// LOGIN
function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

// LOGOUT
function logout() {
  auth.signOut();
  location.reload();
}

// SEND
async function send() {

  if (isLocked && !auth.currentUser) return;

  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  document.getElementById("hero").style.display = "none";
  document.getElementById("chat").style.display = "block";

  addMessage("user", text);
  input.value = "";

  addTyping();

  const res = await fetch("https://krishna-ai-w8we.onrender.com/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ messages: [{ role: "user", content: text }] })
  });

  const data = await res.json();

  removeTyping();

  if (!auth.currentUser && !hasShownLoginGate) {

    const partial = data.answer.split("\n").slice(0,2).join("\n");

    addMessage("bot", partial);

    hasShownLoginGate = true;
    isLocked = true;

    // 🔥 SHOW LOGIN + HIDE INPUT
    document.getElementById("loginWall").style.display = "block";
    document.getElementById("inputBox").classList.add("hidden");

  } else {
    addMessage("bot", data.answer);
  }
}

// UI
function addMessage(role, text) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerText = text;

  chat.appendChild(div);

  setTimeout(() => {
    chat.scrollTo({
      top: chat.scrollHeight,
      behavior: "smooth"
    });
  }, 50);
}

function addTyping() {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.id = "typing";
  div.className = "msg bot";
  div.innerText = "Krishna soch rahe hain...";

  chat.appendChild(div);
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

</script>

</body>
</html>
